<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Visuel e-mail – 20 ans EDLC (1200 × 675)</title>
<style>
@font-face{font-family:"Open Sans";font-weight:400;src:url(open-sans-latin-400-normal.woff2)}
@font-face{font-family:"Open Sans";font-weight:600;src:url(open-sans-latin-600-normal.woff2)}
@font-face{font-family:"Open Sans";font-weight:700;src:url(open-sans-latin-700-normal.woff2)}
@font-face{font-family:"Open Sans";font-weight:800;src:url(open-sans-latin-800-normal.woff2)}
:root{--bleu:#26408F;--bleu-pale:#E6EAF5;--rouge:#E53D34;--rose-pale:#FDE8E6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:675px;background:#fff;overflow:hidden}
body{font-family:"Open Sans",sans-serif;position:relative;-webkit-font-smoothing:antialiased}
.a{position:absolute}
/* Grand 20 : même traitement que l'affiche (Open Sans ExtraBold, bleu, coupé à gauche) */
.vingt{left:-151px;top:-104px;font-weight:800;font-size:820px;line-height:1;letter-spacing:-22px;color:var(--bleu);white-space:nowrap}
.col{left:786px;width:386px}
.t1{top:120px;font-weight:800;font-size:46px;line-height:1.1;color:var(--bleu);white-space:nowrap}
.t2{top:186px;font-weight:800;font-size:40px;line-height:1.15;color:var(--bleu)}
.rule{top:306px;width:56px;height:4px;background:var(--bleu);border-radius:2px}
.pill{border-radius:14px;display:flex;align-items:center}
.p-date{top:338px;height:72px;background:var(--bleu-pale);color:var(--bleu);font-weight:700;font-size:22px;justify-content:center;gap:18px;white-space:nowrap}
.p-date i{width:2.5px;height:40px;background:var(--bleu)}
.p-lieu{top:424px;height:78px;background:var(--rose-pale);color:var(--rouge);font-weight:700;font-size:17.5px;line-height:1.35;padding-left:18px;gap:14px;white-space:nowrap}
.logo{right:38px;bottom:30px;width:210px}
</style></head><body>
<div class="a vingt">20</div>
<div class="a col t1">SAVE THE DATE</div>
<div class="a col t2">20 ANS<br>D’ENGAGEMENT&nbsp;!</div>
<div class="a col rule"></div>
<div class="a col pill p-date"><span>Mardi 15 juin 2027</span><i></i><span>18h30 – 23h</span></div>
<div class="a col pill p-lieu">
  <svg width="22" height="28" viewBox="0 0 22 28"><path d="M11 0C4.9 0 0 4.9 0 11c0 8.2 11 17 11 17s11-8.8 11-17C22 4.9 17.1 0 11 0z" fill="#E53D34"/><circle cx="11" cy="10.5" r="4" fill="#FDE8E6"/></svg>
  <span>Le Philanthro-Lab<br>13-15 rue de la Bûcherie, 75005 Paris</span>
</div>
<img class="a logo" src="logo_edlc.png" alt="Entrepreneurs de la Cité">
</body></html>
