<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Vidéo carrée – 20 ans EDLC</title><style>
@font-face{font-family:"Open Sans";font-weight:400;src:url(open-sans-latin-400-normal.woff2)}
@font-face{font-family:"Open Sans";font-weight:700;src:url(open-sans-latin-700-normal.woff2)}
@font-face{font-family:"Open Sans";font-weight:800;src:url(open-sans-latin-800-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#26408F}
body{font-family:"Open Sans",sans-serif;color:#fff;position:relative}
.c{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
#std{top:50px;font-size:42px;font-weight:800;color:#F3E2C0;letter-spacing:2px}
#t1,#t2{font-size:56px;font-weight:800;color:#F3E2C0;line-height:1.1}
#t1{top:560px}#t2{top:622px}
#bar{position:absolute;left:510px;top:722px;width:60px;height:5px;background:#F3E2C0}
#date{top:748px;font-size:36px;font-weight:700}
#lieu1{top:808px;font-size:24px}
#lieu2{top:842px;font-size:24px}
#card{position:absolute;left:375px;top:900px;width:330px;height:140px;background:#fff;border-radius:16px}
#card div{position:absolute;top:18px;left:0;width:330px;text-align:center;font-size:15px;font-weight:700;color:#26408F;letter-spacing:.3px}
#card img{position:absolute;left:30px;top:50px;width:270px}
svg{position:absolute;left:0;top:0}
#vingt{font-family:"Open Sans";font-weight:800;font-size:560px;letter-spacing:12px}
</style></head><body>
<svg width="1080" height="1080" viewBox="0 0 1080 1080">
  <g id="g20" transform-origin="540 330">
    <text id="vingt" x="540" y="540" text-anchor="middle" fill="#34509E" stroke="#F3E2C0" stroke-width="7" stroke-linejoin="round">20</text>
  </g>
</svg>
<div class="c" id="std">SAVE THE DATE</div>
<div class="c" id="t1">20 ANS DES ENTREPRENEURS</div>
<div class="c" id="t2">DE LA CITÉ</div>
<div id="bar"></div>
<div class="c" id="date">Mardi 15 juin 2027 · 18h30</div>
<div class="c" id="lieu1">Le Philanthro-Lab</div>
<div class="c" id="lieu2">13-15 rue de la Bûcherie, 75005 Paris</div>
<div id="card"><div>ORGANISÉE PAR LA FONDATION</div><img src="logo_edlc.png" alt="Entrepreneurs de la Cité"></div>
<script>
// Animation pilotée par le temps : render(t) dessine l'image exacte à t secondes.
// Ouvrir la page seule joue l'animation en boucle (aperçu) ; le script d'export appelle render(t) image par image.
const DUR = 12;
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);          // easeOutCubic
const back = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const p = (t, a, b) => (t - a) / (b - a);
const $ = id => document.getElementById(id);
let LEN = 2100;
function rise(el, t, a, b, dy = 40) {
  const k = ease(p(t, a, b));
  el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`;
}
function render(t) {
  // 1. Le « 20 » se dessine (contour), puis se remplit
  const d = ease(p(t, 0.2, 2.4));
  const v = $('vingt');
  v.style.strokeDasharray = LEN; v.style.strokeDashoffset = LEN * (1 - d);
  v.style.fillOpacity = ease(p(t, 1.9, 2.8));
  // léger zoom continu pour garder du mouvement
  const z = 0.93 + 0.05 * ease(p(t, 0, 2.8)) + 0.02 * clamp(p(t, 2.8, DUR));
  $('g20').setAttribute('transform', `translate(540 330) scale(${z}) translate(-540 -330)`);
  // 2. Textes
  rise($('std'), t, 2.4, 3.2, -30);
  rise($('t1'), t, 3.0, 3.8);
  rise($('t2'), t, 3.3, 4.1);
  $('bar').style.transform = `scaleX(${ease(p(t, 4.1, 4.7))})`;
  rise($('date'), t, 4.5, 5.2);
  rise($('lieu1'), t, 4.9, 5.6, 25);
  rise($('lieu2'), t, 5.1, 5.8, 25);
  // 3. Carte logo
  const c = $('card'), k = p(t, 6.0, 6.8);
  c.style.opacity = clamp(k * 2); c.style.transform = `scale(${0.6 + 0.4 * back(k)})`;
}
window.DUR = DUR; window.render = render;
window.ready = document.fonts.ready.then(() => { LEN = 2100; render(0); });
if (!navigator.webdriver) {
  const t0 = performance.now();
  window.ready.then(function loop() { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); });
}
</script>
</body></html>
