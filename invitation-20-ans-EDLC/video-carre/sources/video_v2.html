<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Vidéo carrée – 20 ans EDLC</title><style>
@font-face{font-family:"Open Sans";font-weight:400;src:url(open-sans-latin-400-normal.woff2)}
@font-face{font-family:"Open Sans";font-weight:600;src:url(open-sans-latin-600-normal.woff2)}
@font-face{font-family:"Open Sans";font-weight:700;src:url(open-sans-latin-700-normal.woff2)}
@font-face{font-family:"Open Sans";font-weight:800;src:url(open-sans-latin-800-normal.woff2)}
/* palette : bleu #26408F, rouge clair #FDE8E6 (écritures), touche de rouge #EF3F34 */
:root{--bleu:#26408F;--clair:#FDE8E6;--rouge:#EF3F34}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:var(--bleu)}
body{font-family:"Open Sans",sans-serif;color:var(--clair);position:relative}
.scene,.full,canvas,svg{position:absolute;left:0;top:0;width:1080px;height:1080px}
.c{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
.m{overflow:hidden;display:block}            /* masque pour les révélations de lignes */
.m>span{display:inline-block;will-change:transform}
.clair{color:var(--clair)}
/* Scène A : compteur */
#a-annee{top:330px;font-size:250px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#a-ligne{position:absolute;left:240px;top:670px;width:600px;height:4px;background:rgba(253,232,230,.2)}
#a-ligne i{position:absolute;left:0;top:0;height:4px;width:600px;background:var(--rouge);transform-origin:0 0}
#a-tag{top:715px;font-size:30px;font-weight:600}
/* Scène B : le 20 */
#b-vingt{font-family:"Open Sans";font-weight:800;font-size:640px;letter-spacing:14px}
#b-ans{position:absolute;left:770px;top:180px;width:200px;height:200px;border-radius:50%;background:var(--rouge);
  color:var(--clair);font-size:62px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:2px}
/* Scène C : save the date sur fond rouge clair */
#scC{background:var(--clair);color:var(--bleu)}
#c-l1{top:250px;font-size:150px;font-weight:800;line-height:1.05}
#c-l2{top:410px;font-size:150px;font-weight:800;line-height:1.05}
#c-bar{position:absolute;left:390px;top:612px;width:300px;height:10px;background:var(--rouge);transform-origin:0 50%}
#c-t1{top:670px;font-size:56px;font-weight:800;line-height:1.15}
/* Scène D : la date */
#d-mardi{top:170px;font-size:50px;font-weight:800;letter-spacing:16px;text-indent:16px}
#d-15{top:215px;font-size:330px;font-weight:800;line-height:1}
#d-juin{top:575px;font-size:66px;font-weight:800;letter-spacing:6px;text-indent:6px}
#d-heure{position:absolute;left:355px;top:690px;width:370px;height:76px;border-radius:38px;background:var(--rouge);
  font-size:42px;font-weight:800;display:flex;align-items:center;justify-content:center}
#d-lieu1{top:815px;font-size:32px;font-weight:700}
#d-lieu2{top:862px;font-size:26px}
/* Scène E : récapitulatif final */
/* Scène E : signature de l'organisateur (sans répéter la date) */
#e-org{top:385px;font-size:22px;font-weight:700;letter-spacing:6px;text-indent:6px}
#e-logo{position:absolute;left:230px;top:440px;width:620px}
#e-bar{position:absolute;left:500px;top:680px;width:80px;height:6px;background:var(--rouge)}
</style></head><body>
<canvas id="fond" width="1080" height="1080"></canvas>

<div class="scene" id="scA">
  <div class="c clair" id="a-annee">2007</div>
  <div id="a-ligne"><i></i></div>
  <div class="c" id="a-tag"><span class="m"><span>La micro-assurance pour entreprendre</span></span></div>
</div>

<div class="scene" id="scB">
  <svg viewBox="0 0 1080 1080"><g id="b-g"><text id="b-vingt" x="540" y="770" text-anchor="middle" fill="#FDE8E6" fill-opacity="0" stroke="#FDE8E6" stroke-width="8" stroke-linejoin="round">20</text></g></svg>
  <div id="b-ans">ANS</div>
</div>

<div class="scene" id="scC">
  <div class="c" id="c-l1"><span class="m"><span>SAVE THE</span></span></div>
  <div class="c" id="c-l2"><span class="m"><span>DATE</span></span></div>
  <div id="c-bar"></div>
  <div class="c" id="c-t1"><span class="m"><span>20 ANS D’ENGAGEMENT</span></span></div>
</div>

<div class="scene" id="scD">
  <div class="c clair" id="d-mardi">MARDI</div>
  <div class="c clair" id="d-15">15</div>
  <div class="c clair" id="d-juin">JUIN 2027</div>
  <div id="d-heure">18h30–23h</div>
  <div class="c" id="d-lieu1">Le Philanthro-Lab</div>
  <div class="c" id="d-lieu2">13-15 rue de la Bûcherie, 75005 Paris</div>
</div>

<div class="scene" id="scE">
  <div class="c" id="e-org">ORGANISÉE PAR LA FONDATION</div>
  <img id="e-logo" src="logo_edlc_clair.png" alt="Entrepreneurs de la Cité">
  <div id="e-bar"></div>
</div>

<canvas id="confettis" width="1080" height="1080"></canvas>
<div class="full" id="volet" style="background:var(--bleu)"></div>

<script>
// render(t) dessine l'image exacte à t secondes (export image par image) ; ouverte seule, la page joue en boucle.
const DUR = 19.5;
const COL = { bleu:'#26408F', clair:'#FDE8E6', rouge:'#EF3F34' };
const clamp = x => Math.max(0, Math.min(1, x));
const out3 = x => 1 - Math.pow(1 - clamp(x), 3);
const inout = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const p = (t, a, b) => (t - a) / (b - a);
const lerp = (a, b, k) => a + (b - a) * k;
const $ = id => document.getElementById(id);
const LEN = 2300;   // longueur de tiret > périmètre du plus long contour de glyphe (le « 2 »)

// fenêtres des scènes [début, fin] — les changements ont lieu sous le volet de transition
const SC = { A:[0, 3.95], B:[3.95, 8.25], C:[8.25, 12.25], D:[12.25, 16.05], E:[16.05, DUR] };
const show = (id, t, [a, b]) => { $(id).style.visibility = (t >= a && t < b) ? 'visible' : 'hidden'; };
function rise(el, t, a, b, dy = 40) { const k = out3(p(t, a, b)); el.style.opacity = k; el.style.transform = `translateY(${(1-k)*dy}px)`; }
function mask(el, t, a, b) { el.querySelector('.m>span').style.transform = `translateY(${(1 - out3(p(t, a, b))) * 110}%)`; }

// volet diagonal : couvre de gauche à droite pendant [a, a+.45], découvre pendant [a+.45, a+.9]
function wipe(el, t, a) {
  const cov = inout(p(t, a, a + .45)), unc = inout(p(t, a + .45, a + .9));
  if (t < a || t > a + .9) { el.style.clipPath = 'polygon(0 0,0 0,0 0)'; return; }
  const lead = lerp(-20, 1500, cov), trail = lerp(-20, 1500, unc);
  el.style.clipPath = `polygon(${trail}px 0,${lead}px 0,${lead-380}px 1080px,${trail-380}px 1080px)`;
}
function wipes(t, a) { wipe($('volet'), t, a); }

// générateur pseudo-aléatoire à graine : même vidéo à chaque export
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let r = Math.imul(seed ^ seed >>> 15, 1 | seed);
  r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
const PAL = [COL.rouge, COL.clair, COL.rouge, COL.clair, COL.clair];
function makeBurst(seed, n, cx, cy) { const r = rng(seed); return Array.from({length:n}, () => {
  const ang = r() * Math.PI * 2, sp = 500 + r() * 900;
  return { x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 350, c: PAL[r()*5|0], s: 10 + r()*16,
           sh: r()*3|0, rot: r()*6.28, vr: (r()-.5)*14, drag: 1.4 + r() }; }); }
const BURST1 = makeBurst(7, 90, 540, 520);
const BURST2 = makeBurst(21, 45, 540, 530);
const RAIN = (() => { const r = rng(99); return Array.from({length:46}, () => ({ x: r()*1080, y0: -60 - r()*1100, v: 70 + r()*90,
  amp: 10 + r()*30, f: .6 + r()*1.4, ph: r()*6.28, c: PAL[r()*5|0], s: 8 + r()*12, sh: r()*3|0, rot: r()*6.28, vr: (r()-.5)*4 })); })();

function piece(g, x, y, s, rot, c, sh, a) {
  g.save(); g.globalAlpha = a; g.translate(x, y); g.rotate(rot); g.fillStyle = c;
  if (sh === 0) g.fillRect(-s/2, -s/4, s, s/2);
  else if (sh === 1) { g.beginPath(); g.arc(0, 0, s/2.6, 0, 6.29); g.fill(); }
  else { g.beginPath(); g.moveTo(0, -s/2); g.lineTo(s/2, s/2); g.lineTo(-s/2, s/2); g.closePath(); g.fill(); }
  g.restore();
}
function drawBurst(g, list, dt) {
  if (dt < 0 || dt > 3) return;
  for (const q of list) {
    const k = (1 - Math.exp(-q.drag * dt)) / q.drag;               // vitesse freinée par l'air
    const x = q.x + q.vx * k, y = q.y + q.vy * k + 420 * dt * dt;  // + gravité
    piece(g, x, y, q.s, q.rot + q.vr * dt, q.c, q.sh, clamp(1.6 - dt * .6));
  }
}
function drawBackground(t, bg) {
  const g = $('fond').getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, 1080, 1080);
  // confettis de fin : derrière les textes pour ne pas gêner la lecture
  drawBurst(g, BURST2, t - 17.2);
  if (t > 17.3) {
    const dt = t - 17.3, a = clamp(dt * 1.5) * .7;
    for (const q of RAIN) piece(g, q.x + q.amp * Math.sin(q.f * dt * 3 + q.ph), q.y0 + 300 + q.v * dt * 3, q.s, q.rot + q.vr * dt, q.c, q.sh, a);
  }
}

function render(t) {
  for (const k in SC) show('sc' + k, t, SC[k]);
  drawBackground(t, (t >= SC.C[0] && t < SC.C[1]) ? COL.clair : COL.bleu);

  // ── Scène A : « Depuis 2007 » → 2027
  const ka = inout(p(t, .7, 2.7));
  $('a-annee').textContent = 2007 + Math.round(20 * ka);
  const pop = t > 2.7 ? 1 + .08 * Math.sin(clamp(p(t, 2.7, 3.1)) * Math.PI) : 1;
  $('a-annee').style.opacity = out3(p(t, .3, 1)); $('a-annee').style.transform = `scale(${(0.9 + .1 * out3(p(t, .3, 1))) * pop})`;
  $('a-ligne').style.opacity = out3(p(t, .5, .9));
  $('a-ligne').querySelector('i').style.transform = `scaleX(${ka})`;
  mask($('a-tag'), t, 2.6, 3.3);

  // ── Scène B : le « 20 » se dessine, se remplit, explosion de confettis, pastille « ANS »
  const v = $('b-vingt'), d = out3(p(t, 4.1, 5.9));
  v.style.strokeDasharray = LEN; v.style.strokeDashoffset = LEN * (1 - d);
  v.style.fillOpacity = .14 * out3(p(t, 5.6, 6.1));
  const zb = 0.9 + .1 * out3(p(t, 4, 6.2)) + .03 * clamp(p(t, 6.2, 8.2));
  $('b-g').setAttribute('transform', `translate(540 540) scale(${zb}) translate(-540 -540)`);
  const kb = p(t, 6.0, 6.6); $('b-ans').style.opacity = clamp(kb * 3);
  $('b-ans').style.transform = `scale(${back(kb)}) rotate(${lerp(-40, -12, out3(kb))}deg)`;

  // ── Scène C : SAVE THE DATE (fond rouge clair)
  mask($('c-l1'), t, 8.6, 9.2); mask($('c-l2'), t, 8.85, 9.45);
  $('c-bar').style.transform = `scaleX(${out3(p(t, 9.5, 10.1))})`;
  mask($('c-t1'), t, 9.9, 10.5);

  // ── Scène D : la date
  rise($('d-mardi'), t, 12.6, 13.2, -30);
  const k15 = p(t, 12.8, 13.5); $('d-15').style.opacity = clamp(k15 * 3); $('d-15').style.transform = `scale(${lerp(.6, 1, back(k15))})`;
  rise($('d-juin'), t, 13.2, 13.8);
  const kh = p(t, 13.7, 14.2); $('d-heure').style.opacity = clamp(kh * 3); $('d-heure').style.transform = `scale(${back(kh)})`;
  rise($('d-lieu1'), t, 14.1, 14.7, 25); rise($('d-lieu2'), t, 14.3, 14.9, 25);

  // ── Scène E : signature
  rise($('e-org'), t, 16.5, 17.1, -25);
  const kl = p(t, 16.7, 17.4); $('e-logo').style.opacity = out3(kl); $('e-logo').style.transform = `scale(${lerp(.85, 1, out3(kl))})`;
  $('e-bar').style.transform = `scaleX(${out3(p(t, 17.3, 17.8))})`;

  // ── Confettis (au-dessus des scènes, sous le volet)
  const g = $('confettis').getContext('2d'); g.clearRect(0, 0, 1080, 1080);
  drawBurst(g, BURST1, t - 5.75);

  // ── Volets de transition
  wipe2(t);
}
// un seul volet bleu pour chaque changement de scène
function wipe2(t) {
  const starts = [SC.B[1], SC.C[1], SC.D[1]].map(x => x - .45);
  const a = [SC.A[1] - .45, ...starts].find(s => t >= s - .1 && t <= s + .95);
  if (a !== undefined) wipes(t, a); else wipes(t, -10);
}
window.DUR = DUR; window.render = render;
window.ready = document.fonts.ready.then(() => render(0));
if (!navigator.webdriver) {
  const t0 = performance.now();
  window.ready.then(function loop() { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); });
}
</script>
</body></html>
